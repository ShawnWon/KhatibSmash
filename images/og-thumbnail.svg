<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#132738" />
      <stop offset="100%" stop-color="#09101d" />
    </linearGradient>

    <!-- Teal Glow Gradient -->
    <radialGradient id="tealGlow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0" />
    </radialGradient>

    <!-- Emerald Glow Gradient -->
    <radialGradient id="emeraldGlow" cx="85%" cy="75%" r="65%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Paddle Gradient -->
    <linearGradient id="paddleRubber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="paddleHandle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#tealGlow)" />
  <rect width="1200" height="630" fill="url(#emeraldGlow)" />

  <!-- Subtle Grid Pattern in Background -->
  <g stroke="#334155" stroke-width="1" opacity="0.15">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Left: Content Info -->
  <g transform="translate(100, 110)">
    <!-- Badge -->
    <g>
      <rect width="330" height="38" rx="19" fill="#14b8a6" fill-opacity="0.15" stroke="#14b8a6" stroke-width="1.5" />
      <circle cx="20" cy="19" r="6" fill="#2dd4bf" />
      <text x="36" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#2dd4bf" letter-spacing="1">
        SINGAPORE COMMUNITY LEAGUE
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="900" fill="url(#textGrad)" letter-spacing="-1">
      KhatibSmash
    </text>

    <!-- Subtitle -->
    <text x="0" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="700" fill="#f8fafc">
      Table Tennis Rating &amp; Tournament League
    </text>

    <!-- Chinese Subtitle / Description -->
    <text x="0" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="22" font-weight="500" fill="#94a3b8">
      开球网积分赛系统 · 实时天梯榜 · 对阵图 · 社区留言板
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 280)">
      <!-- Tag 1 -->
      <g>
        <rect width="160" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="80" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600" fill="#38bdf8">🏆 Live Ratings</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(175, 0)">
        <rect width="170" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="85" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600" fill="#34d399">📊 Pool &amp; Bracket</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(360, 0)">
        <rect width="180" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="90" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600" fill="#f59e0b">⚔️ Head to Head</text>
      </g>
    </g>
  </g>

  <!-- Right: Decorative Visual Elements (Table Tennis Paddle + Ball + Standings Card) -->
  <g transform="translate(800, 110)">
    <!-- Glass Standings Card Graphic -->
    <rect x="-10" y="20" width="320" height="380" rx="24" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Card Header -->
    <rect x="-10" y="20" width="320" height="60" rx="24" fill="#1e293b" fill-opacity="0.9" />
    <circle cx="20" cy="50" r="14" fill="#14b8a6" />
    <text x="45" y="56" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="800" fill="#ffffff">Top Standings</text>
    <text x="270" y="56" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#2dd4bf">PTS</text>

    <!-- Player 1 -->
    <g transform="translate(10, 105)">
      <circle cx="20" cy="18" r="14" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.5" />
      <text x="20" y="23" text-anchor="middle" font-size="13" font-weight="900" fill="#fbbf24">1</text>
      <text x="45" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Crystal</text>
      <text x="250" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="17" font-weight="900" fill="#2dd4bf">1642</text>
    </g>

    <!-- Divider -->
    <line x1="10" y1="160" x2="290" y2="160" stroke="#334155" stroke-width="1" />

    <!-- Player 2 -->
    <g transform="translate(10, 180)">
      <circle cx="20" cy="18" r="14" fill="#94a3b8" fill-opacity="0.2" stroke="#94a3b8" stroke-width="1.5" />
      <text x="20" y="23" text-anchor="middle" font-size="13" font-weight="900" fill="#cbd5e1">2</text>
      <text x="45" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Yeoh K.C.</text>
      <text x="250" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="17" font-weight="900" fill="#2dd4bf">1598</text>
    </g>

    <!-- Divider -->
    <line x1="10" y1="235" x2="290" y2="235" stroke="#334155" stroke-width="1" />

    <!-- Player 3 -->
    <g transform="translate(10, 255)">
      <circle cx="20" cy="18" r="14" fill="#b45309" fill-opacity="0.2" stroke="#b45309" stroke-width="1.5" />
      <text x="20" y="23" text-anchor="middle" font-size="13" font-weight="900" fill="#d97706">3</text>
      <text x="45" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Lin Xue</text>
      <text x="250" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="17" font-weight="900" fill="#2dd4bf">1485</text>
    </g>

    <!-- Bottom Rating Delta indicator -->
    <g transform="translate(15, 335)">
      <rect width="270" height="34" rx="8" fill="#14b8a6" fill-opacity="0.1" stroke="#14b8a6" stroke-width="1" />
      <text x="135" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#2dd4bf">
        ⚡ USATT / Kaiqiu Rating Engine
      </text>
    </g>
  </g>

  <!-- Glowing Ping Pong Ball Visual -->
  <g transform="translate(735, 360)">
    <circle cx="0" cy="0" r="32" fill="#ffffff" filter="drop-shadow(0 0 15px rgba(45, 212, 191, 0.8))" />
    <path d="M-15,-8 Q 0,-25 18,-6" stroke="#e2e8f0" stroke-width="2.5" fill="none" opacity="0.7" />
  </g>
</svg>
